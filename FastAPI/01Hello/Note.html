<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fast api Note</title>
</head>
<body>

    <form action="http://127.0.0.1:8000/aaa" method="get">
        <input type="submit" value="AAA-GET">
    </form>
    <hr>
    <form action="http://127.0.0.1:8000/aaa" method="post">
        <input type="submit" value="AAA-POST">
    </form>

    <hr>
    <form action="http://127.0.0.1:8000/bbb" method="get">
        <input type="submit" value="BBB-GET">
    </form>
    <hr>
    <form action="http://127.0.0.1:8000/bbb" method="post">
        <input type="submit" value="BBB-POST">
    </form>

    <hr>
    <form action="http://127.0.0.1:8000/test" method="get">
        <input type="text" placeholder="이름" name="name">
        <input type="text" placeholder="메세지" name="msg">
        <input type="submit" value="GET 방식으로 보내기~!">
    </form>
    <hr>
    <form action="http://127.0.0.1:8000/test" method="post">
        <input type="text" placeholder="이-름" name="name">
        <input type="text" placeholder="메세쥐~" name="msg">
        <input type="submit" value="POST 방식으로 보내기~!">
    </form>
    <hr>
    <form action="http://127.0.0.1:8000/test2" method="post">
        <input type="text" placeholder="이이름름" name="name">
        <input type="text" placeholder="메씨지" name="msg">
        <input type="submit" value="POST 방식으로 보내기!!2222">
    </form>

    <hr>
    <button onclick="aaa()">POST + SUBPATH + DATA</button>
    <script>
        function aaa(){
            fetch('http://127.0.0.1:8000/notes/21',{
                method:'POST',
                headers:{
                    'Content-Type':'application/x-www-form-urlencoded'
                },
                body: 'title=Hello&msg=nice+to+meet+you'
            })
            .then(res=>res.text()).then(text=>alert(text))
        }
    </script>

    <hr>
    <button>POST + SUBPATH + JSON DATA</button>
    <script>
        function bbb(){
            fetch('http://127.0.0.1:8000/json', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body: JSON.stringify({userid:"sam", msg:"json~!@"})
            })
            .then(res=>res.text()).then(text=>alert(text))
        }
    </script>
</body>
</html>
